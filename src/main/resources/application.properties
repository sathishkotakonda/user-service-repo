server.port=8090

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
server.servlet.context-path=/user-app

# DATABASE CONFIGURATION
spring.datasource.url=jdbc:mysql://user-service.cdgmg8ysi1o2.ap-south-2.rds.amazonaws.com:3306/userdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
